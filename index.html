<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Follow OS/browser chrome theme, not the in-app theme toggle -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/itrs-favicon-light-mode.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/itrs-favicon-dark-mode.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/svg+xml" href="/itrs-favicon-light-mode.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITRS DEM</title>
    <script>
      try {
        if (localStorage.getItem('itrs-dem-theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="detached-panels-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
