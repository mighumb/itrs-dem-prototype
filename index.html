<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon-svg" rel="icon" type="image/svg+xml" href="/itrs-favicon-light-mode.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITRS DEM</title>
    <script>
      try {
        var theme = localStorage.getItem('itrs-dem-theme') === 'dark' ? 'dark' : 'light'
        if (theme === 'dark') {
          document.documentElement.classList.add('dark')
        }
        var svg = document.getElementById('app-favicon-svg')
        if (svg) {
          svg.href =
            theme === 'dark'
              ? '/itrs-favicon-dark-mode.svg'
              : '/itrs-favicon-light-mode.svg'
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="detached-panels-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
