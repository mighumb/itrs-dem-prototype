<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Follow OS/browser chrome theme, not the in-app theme toggle -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/itrs-favicon-light-mode.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/itrs-favicon-dark-mode.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/svg+xml" href="/itrs-favicon-light-mode.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content"
    />
    <!-- Kept in sync with in-app theme (see ThemeContext) so browser chrome matches UI. -->
    <meta name="theme-color" content="#f5f5f7" />
    <title>ITRS DEM</title>
    <script>
      try {
        var dark = localStorage.getItem('itrs-dem-theme') === 'dark'
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', dark ? '#0a0a0b' : '#f5f5f7')
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="detached-panels-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
